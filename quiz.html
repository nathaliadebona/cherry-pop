<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cherry Pop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img id="logo" src="assets/logo-cherry-pop-stencil.png" alt="Cherry Pop logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="quiz.html">Quiz</a></li>
            </ul>

            <a href="cart.html" class="cart-link">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </a>
        </nav>
    </header>

    <main>
        <h1>Which Cherry Pop Treat Matches You?</h1>

        <form id="quiz-form">
            <div class="quiz-question">
                <h2>How do you like to enjoy your treat?</h2>

                <div class="quiz-options">
                    <label>
                        <input type="radio" name="q1" value="cones">
                        On the move, taking bites as you go
                    </label>

                    <label>
                        <input type="radio" name="q1" value="cups">
                        Sitting down with a spoon
                    </label>

                    <label>
                        <input type="radio" name="q1" value="shakes">
                        Sipping through a straw
                    </label>
                </div>
            </div>

            <div class="quiz-question">
                <h2>Pick a vibe:</h2>

                <div class="quiz-options">
                    <label>
                        <input type="radio" name="q2" value="cones">
                        On the go, always moving
                    </label>

                    <label>
                        <input type="radio" name="q2" value="cups">
                        Cozy afternoon at the counter
                    </label>

                    <label>
                        <input type="radio" name="q2" value="shakes">
                        Loud music, good friends
                    </label>
                </div>
            </div>

            <div class="quiz-question">
                <h2>Choose a topping:</h2>

                <div class="quiz-options">
                    <label>
                        <input type="radio" name="q3" value="cones">
                        Crunchy sprinkles
                    </label>

                    <label>
                        <input type="radio" name="q3" value="cups">
                        A drizzle of syrup
                    </label>

                    <label>
                        <input type="radio" name="q3" value="shakes">
                        Whipped cream on top
                    </label>
                </div>
            </div>

            <button type="submit">See My Result</button>
        </form>

         <div id="quiz-result"></div>
    </main>

    <footer>
        <p>Cherry Pop — Est. 1958</p>
        <p>Made with love and a lot of sprinkles.</p>

        <ul class="social-media">
            <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
            <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
            <li><a href="#"><i class="fa-brands fa-tiktok"></i></a></li>
        </ul>
    </footer>

    <script src="script.js"></script>
</body>
</html>
