<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cherry Pop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img id="logo" src="assets/logo-cherry-pop-stencil.png" alt="Cherry Pop logo">

        <nav>
            <ul>
                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="menu.html">
                        <i class="fa-solid fa-ice-cream"></i>
                        <span>Menu</span>
                    </a>
                </li>
                <li>
                    <a href="about.html">
                        <i class="fa-solid fa-heart"></i>
                        <span>About</span>
                    </a>
                </li>
                <li>
                    <a href="quiz.html"  class="active">
                        <i class="fa-solid fa-circle-question"></i>
                        <span>Quiz</span>
                    </a>
                </li>
                <li>
                    <a href="cart.html" class="cart-link">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <svg class="header-wave" viewBox="0 0 1440 60" preserveAspectRatio="none">
        <path d="M0,0 C240,60 480,0 720,30 C960,60 1200,0 1440,20 L1440,0 L0,0 Z" fill="currentColor"></path>
    </svg>

    <main class="quiz">
        <h1>Which Cherry Pop Treat Matches You?</h1>

        <form class="quiz-form">
            <div class="quiz-question">
                <h2>How do you like to enjoy your treat?</h2>

                <div class="quiz-options">
                    <label>
                        <input type="radio" name="q1" value="cones">
                        <span>On the move, taking bites as you go</span>
                    </label>

                    <label>
                        <input type="radio" name="q1" value="cups">
                        <span>Sitting down with a spoon</span>
                    </label>

                    <label>
                        <input type="radio" name="q1" value="shakes">
                        <span>Sipping through a straw</span>
                    </label>
                </div>
            </div>

            <div class="quiz-question">
                <h2>Pick a vibe:</h2>

                <div class="quiz-options">
                    <label>
                        <input type="radio" name="q2" value="cones">
                        <span>On the go, always moving</span>
                    </label>

                    <label>
                        <input type="radio" name="q2" value="cups">
                        <span>Cozy afternoon at the counter</span>
                    </label>

                    <label>
                        <input type="radio" name="q2" value="shakes">
                        <span>Loud music, good friends</span>
                    </label>
                </div>
            </div>

            <div class="quiz-question">
                <h2>Choose a topping:</h2>

                <div class="quiz-options">
                    <label>
                        <input type="radio" name="q3" value="cones">
                        <span>Crunchy sprinkles</span>
                    </label>

                    <label>
                        <input type="radio" name="q3" value="cups">
                        <span>A drizzle of syrup</span>
                    </label>

                    <label>
                        <input type="radio" name="q3" value="shakes">
                        <span>Whipped cream on top</span>
                    </label>
                </div>
            </div>

            <button type="submit">See My Result</button>
        </form>

         <div id="quiz-result"></div>
    </main>

    <footer>
        <img src="assets/logo-cherry-pop-stencil.png" alt="Cherry Pop logo" class="footer-logo">

        <div class="footer-info">
            <p>Cherry Pop — Est. 1958</p>
            <p>Made with love and a lot of sprinkles.</p>
            <ul class="social-media">
                <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-tiktok"></i></a></li>
            </ul>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
